name: Build and publish APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install required SDK components
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ.get("GITHUB_REF_NAME", "")
          version = tag.lstrip("v")
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              text = ""

          match = re.search(
              rf"^##\s+\[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^##\s|\Z)",
              text,
              re.M | re.S,
          )
          body = match.group(1).strip() if match else f"Обновление {tag}."
          open("release-notes.md", "w", encoding="utf-8").write(body + "\n")
          PY

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
